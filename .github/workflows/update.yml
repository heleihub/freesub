name: Update Subscriptions

on:
  schedule:
    # 每天 UTC 0/6/12/18 点运行
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    # 这是海外 Azure/GitHub runner：可以验证“海外可达”，不能冒充大陆直连实测。
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Regression Test Parsers
        run: |
          cd scripts
          python test_parsers.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run Real-Prober and Classifier (sing-box)
        run: python scripts/main_v2.py
        env:
          PYTHONUNBUFFERED: '1'
          # 2-core runner 默认 20 并发；可在 workflow_dispatch 环境中覆盖。
          MAX_WORKERS_TEST: '20'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
            output/mainland-candidate.txt
            output/mainland-candidate-clash.yaml
            output/mainland-candidate-singbox.json
            output/proxy-candidate.txt
            output/proxy-candidate-clash.yaml
            output/proxy-candidate-singbox.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json \
                   mainland-candidate.txt mainland-candidate-clash.yaml mainland-candidate-singbox.json \
                   proxy-candidate.txt proxy-candidate-clash.yaml proxy-candidate-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"
            sleep 0.15
          done
          echo "[+] jsDelivr CDN purge done (after push)"
